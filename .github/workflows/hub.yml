name: Hub frontend
on:
  pull_request:
    paths: ['index.html', 'board.js', 'tests/**', '.github/workflows/hub.yml']
  push:
    branches: [main]
    paths: ['index.html', 'board.js', 'tests/**', '.github/workflows/hub.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hub.test.cjs
